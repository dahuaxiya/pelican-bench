name: Distribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s tests -v
      - name: Check frontend timing and rankings
        run: |
          npm install --prefix "$RUNNER_TEMP/pelican-ui-tests" --no-package-lock --ignore-scripts jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/pelican-ui-tests/node_modules" node --test tests/*.cjs
